deepseek:
  api-key: ${DEEPSEEK_API_KEY}
  base-url: https://api.deepseek.com

qdrant:
  host: localhost
  port: 16333
  doc-collection: aiknowledge-doc

ollama:
  host: localhost
  port: 11434
  model: nomic-embed-text

meilisearch:
  host: localhost
  port: 7700

spring:
  redis:
    host: localhost
    port: 6379
    timeout: 2000

server:
  port: 8081

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"

tool:
  whitelist: ${TOOL_WHITELIST:}
  execution:
    timeout-seconds: 10
    max-retries: 2
    backoff-initial-ms: 1000
